# SSH Buttons Configuration
server:
  port: 8080
  session_secret: "change-this-to-a-secure-random-string"
  timeout: 15

users:
  - user: "admin"
    pass: "adminpassword"
    role: "admin"
  - user: "operator1"
    pass: "operatorpassword"
    role: "operator"

hosts:
  srv_linux:
    name: "Ubuntu Production 01"
    host: "192.168.1.10"
    user: "root"
    key: "./keys/id_ed25519"

  router_mikrotik:
    name: "Core Gateway"
    host: "192.168.1.1"
    user: "admin"
    pass: "RouterPassword"

  switch_cisco:
    name: "Access Switch 24P"
    host: "192.168.1.2"
    user: "cisco"
    pass: "CiscoEnablePassword"

categories:
  - name: "Linux Operations"
    host: "srv_linux" # Inherited by all buttons in this category
    buttons:
      - name: "Restart Docker"
        cmd: "systemctl restart docker"
        warning: true # sets warning style + confirmation prompt
        timeout: 30
      - name: "Check Disk Space"
        cmd: "df -h"
      - name: "Reboot Server"
        cmd: "sudo reboot"
        danger: true # sets danger style + confirmation prompt
      - name: "Power Off Server"
        cmd: "sudo shutdown -h now"
        danger: true

  - name: "Network Gear"
    buttons:
      - name: "Reboot MikroTik"
        host: "router_mikrotik"
        cmd: "/system reboot"
        danger: true
      - name: "Backup MikroTik"
        host: "router_mikrotik"
        cmd: "/system backup save name=auto-backup"
        style: "success"
      - name: "Save Cisco Config"
        host: "switch_cisco"
        cmd: "write memory"
        style: "success"
      - name: "Reload Switch"
        host: "switch_cisco"
        cmd: "reload"
        danger: true
