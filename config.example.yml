# SSH Buttons Configuration File
# Clean, minimal declarative configuration without duplication.

server:
  port: 8080
  session_secret: "change-this-to-a-secure-random-string"
  timeout: 15 # Default command timeout in seconds

# User accounts and roles (admin or operator)
users:
  - user: "admin"
    pass: "adminpassword" # Plaintext or $2a$... bcrypt hash
    role: "admin"

  - user: "operator1"
    pass: "operatorpassword"
    role: "operator"

# Remote host definitions
# Port defaults to 22; internal host key check disabled by default
hosts:
  # Example 1: Linux Server using SSH Private Key
  srv_linux:
    name: "Ubuntu Production 01"
    host: "192.168.1.10"
    user: "root"
    key: "./keys/id_ed25519"

  # Example 2: MikroTik RouterOS using Password
  router_mikrotik:
    name: "Core Gateway"
    host: "192.168.1.1"
    user: "admin"
    pass: "RouterPassword"

  # Example 3: Cisco / Switch using Password
  switch_cisco:
    name: "Access Switch 24P"
    host: "192.168.1.2"
    user: "cisco"
    pass: "CiscoEnablePassword"

# Button categories
# Defining `host` on a category cascades to all child buttons automatically
categories:
  - name: "Linux Operations"
    host: "srv_linux" # Inherited by all buttons below
    buttons:
      - name: "Restart Docker"
        cmd: "systemctl restart docker"
        warning: true # Shortcut for style: warning & confirm: true
        timeout: 30

      - name: "Check Disk Space"
        cmd: "df -h"

      - name: "Reboot Server"
        cmd: "sudo reboot"
        danger: true # Shortcut for style: danger & confirm: true

      - name: "Power Off Server"
        cmd: "sudo shutdown -h now"
        danger: true

  - name: "Network Gear"
    buttons:
      - name: "Reboot MikroTik"
        host: "router_mikrotik" # Explicit host override
        cmd: "/system reboot"
        danger: true

      - name: "Backup MikroTik"
        host: "router_mikrotik"
        cmd: "/system backup save name=auto-backup"
        style: "success"

      - name: "Save Cisco Config"
        host: "switch_cisco"
        cmd: "write memory"
        style: "success"

      - name: "Reload Switch"
        host: "switch_cisco"
        cmd: "reload"
        danger: true
