<!DOCTYPE html>
<html lang="{{.Lang}}" dir="{{.Dir}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090a0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>{{.T.config_editor}} - {{.T.app_title}}</title>
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --bg: #090a0c;
      --surface: #121417;
      --surface-elevated: #181b20;
      --surface-inset: #0c0d10;
      --border: #22262b;
      --border-hover: #323740;
      --border-focus: #4b525f;
      --text: #f4f4f5;
      --text-muted: #8b929e;
      --text-dim: #555b66;
      --danger-border: #4d1d24;
      --danger-bg: #1c0f12;
      --danger-text: #f87171;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }
    .header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 0 1rem;
      min-height: 52px;
      display: flex;
      align-items: center;
    }
    .header-inner {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .brand-link {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: inherit;
    }
    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand-title {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-header {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.4rem 0.65rem;
      border-radius: 6px;
      font-size: 0.8125rem;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      min-height: 36px;
      white-space: nowrap;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      touch-action: manipulation;
    }
    .btn-header:hover {
      color: var(--text);
      border-color: var(--border-hover);
      background: var(--surface-elevated);
    }
    .btn-save {
      background: #f4f4f5;
      color: #090a0c;
      border: 1px solid transparent;
      font-weight: 600;
    }
    .btn-save:hover {
      background: #e4e4e7;
      color: #090a0c;
    }
    .btn-save:active {
      transform: translateY(1px);
    }

    /* Hamburger Menu Button */
    .btn-hamburger {
      display: none;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
      touch-action: manipulation;
      transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
      flex-shrink: 0;
    }
    .btn-hamburger:hover {
      color: var(--text);
      border-color: var(--border-hover);
      background: var(--surface-elevated);
    }
    .btn-hamburger:active {
      transform: translateY(1px);
    }
    .btn-hamburger .icon-close {
      display: none;
    }
    .btn-hamburger[aria-expanded="true"] .icon-menu {
      display: none;
    }
    .btn-hamburger[aria-expanded="true"] .icon-close {
      display: block;
    }

    /* Mobile Backdrop */
    .nav-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
      z-index: 45;
    }
    .nav-backdrop.is-open {
      display: block;
    }

    @media (max-width: 768px) {
      .btn-hamburger {
        display: inline-flex;
      }
      .header-actions {
        display: none;
        position: absolute;
        top: 100%;
        left: 0;
        right: 0;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.65);
        flex-direction: column;
        padding: 0.75rem 1rem 1rem 1rem;
        gap: 0.5rem;
        z-index: 50;
      }
      .header-actions.is-open {
        display: flex;
        animation: navSlideDown 0.18s ease-out;
      }
      .header-actions .btn-header {
        width: 100%;
        justify-content: flex-start;
        padding: 0.65rem 0.85rem;
        font-size: 0.875rem;
        min-height: 44px;
      }
      .header-actions form {
        width: 100%;
        display: block !important;
      }
      .header-actions form .btn-header {
        width: 100%;
      }
    }
    @keyframes navSlideDown {
      from {
        opacity: 0;
        transform: translateY(-6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 480px) {
      .brand-title {
        font-size: 0.95rem;
        max-width: 220px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    }
    .container {
      width: 100%;
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.25rem 1rem;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .editor-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 480px;
    }
    .editor-top-bar {
      padding: 0.65rem 1rem;
      background: var(--surface-elevated);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-size: 0.75rem;
      color: var(--text-dim);
    }
    .editor-file-badge {
      font-family: monospace;
      color: #38bdf8;
      background: var(--surface-inset);
      border: 1px solid var(--border);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
    }
    .error-banner {
      background: var(--danger-bg);
      border-bottom: 1px solid var(--danger-border);
      color: var(--danger-text);
      padding: 0.75rem 1rem;
      font-size: 0.8125rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .yaml-editor {
      width: 100%;
      flex: 1;
      background: var(--surface-inset);
      border: none;
      color: #e4e4e7;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 0.875rem;
      line-height: 1.5;
      padding: 1rem;
      outline: none;
      resize: vertical;
      min-height: 450px;
      direction: ltr;
      text-align: left;
      white-space: pre;
      overflow-wrap: normal;
      overflow-x: auto;
      tab-size: 2;
    }
    .yaml-editor:focus {
      box-shadow: inset 0 0 0 1px var(--border-focus);
    }
    .editor-footer-actions {
      padding: 0.75rem 1rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.6rem;
    }
    @media (max-width: 639px) {
      .editor-footer-actions {
        flex-direction: column-reverse;
      }
      .editor-footer-actions button,
      .editor-footer-actions a {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a href="/" class="brand-link">
        <img src="/static/icon.svg" alt="Logo" class="brand-logo">
        <span class="brand-title">{{.T.app_title}} / {{.T.config_editor}}</span>
      </a>

      <!-- Mobile Hamburger Button -->
      <button type="button" class="btn-hamburger" id="hamburgerBtn" aria-label="{{.T.menu}}" aria-expanded="false" aria-controls="headerActions">
        <svg class="icon-menu" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
        <svg class="icon-close" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>

      <div class="header-actions" id="headerActions">
        <!-- Language Switcher -->
        <a href="/set-lang?lang={{.OtherLang}}" class="btn-header" title="{{.T.language}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="2" y1="12" x2="22" y2="12"></line>
            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
          </svg>
          <span>{{.OtherLabel}}</span>
        </a>

        <!-- Documentation Link (Opens in new tab to preserve editor state) -->
        <a href="/docs" target="_blank" class="btn-header" title="{{.T.docs}}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
          </svg>
          <span>{{.T.docs}}</span>
        </a>

        <!-- Discard Link -->
        <a href="/" class="btn-header">
          {{.T.discard}}
        </a>

        <!-- Save Button -->
        <button type="submit" form="configForm" class="btn-header btn-save">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
            <polyline points="17 21 17 13 7 13 7 21"></polyline>
            <polyline points="7 3 7 8 15 8"></polyline>
          </svg>
          <span>{{.T.save_changes}}</span>
        </button>
      </div>
    </div>
  </header>
  <div class="nav-backdrop" id="navBackdrop"></div>

  <main class="container">
    <form id="configForm" method="POST" action="/config" style="display: flex; flex-direction: column; flex: 1;">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <div class="editor-card">
        <div class="editor-top-bar">
          <span class="editor-file-badge">config.yml</span>
          <span>{{.T.editor_hint}}</span>
        </div>

        {{if .Error}}
        <div class="error-banner" role="alert">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span>{{.Error}}</span>
        </div>
        {{end}}

        <textarea id="configYaml" name="config_yaml" class="yaml-editor" spellcheck="false">{{.Content}}</textarea>

        <div class="editor-footer-actions">
          <a href="/" class="btn-header" style="text-align: center;">{{.T.discard}}</a>
          <button type="submit" class="btn-header btn-save">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span>{{.T.save_changes}}</span>
          </button>
        </div>
      </div>
    </form>
  </main>

  <script>
    const textarea = document.getElementById('configYaml');
    // Tab key inserts 2 spaces
    textarea.addEventListener('keydown', function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        const start = this.selectionStart;
        const end = this.selectionEnd;
        this.value = this.value.substring(0, start) + '  ' + this.value.substring(end);
        this.selectionStart = this.selectionEnd = start + 2;
      }
    });

    // Mobile Hamburger Navigation
    (function() {
      const btn = document.getElementById('hamburgerBtn');
      const nav = document.getElementById('headerActions');
      const backdrop = document.getElementById('navBackdrop');

      if (!btn || !nav) return;

      function toggleNav(open) {
        const isOpen = open !== undefined ? open : !nav.classList.contains('is-open');
        nav.classList.toggle('is-open', isOpen);
        btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        if (backdrop) backdrop.classList.toggle('is-open', isOpen);
        document.body.style.overflow = isOpen ? 'hidden' : '';
      }

      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        toggleNav();
      });

      if (backdrop) {
        backdrop.addEventListener('click', function() {
          toggleNav(false);
        });
      }

      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && nav.classList.contains('is-open')) {
          toggleNav(false);
        }
      });

      window.addEventListener('resize', function() {
        if (window.innerWidth > 768 && nav.classList.contains('is-open')) {
          toggleNav(false);
        }
      });
    })();
  </script>
</body>
</html>
