services:
  # Auto-initialization helper: Copies config.example.yml to config.yml on first run if missing
  init-config:
    image: alpine:3.21
    restart: "no"
    volumes:
      - ./:/workspace
    command: >
      sh -c "if [ ! -f /workspace/config.yml ]; then
               cp /workspace/config.example.yml /workspace/config.yml &&
               echo '[init-config] Initialized config.yml from config.example.yml';
             else
               echo '[init-config] config.yml already exists.';
             fi"

  ssh_buttons:
    build:
      context: .
      dockerfile: Dockerfile
    image: ssh_buttons:latest
    container_name: ssh_buttons
    restart: unless-stopped
    depends_on:
      init-config:
        condition: service_completed_successfully
    # Exposed for reverse proxies (Traefik, Nginx, Caddy, Cloudflare Tunnel, Docker networks)
    expose:
      - "${PORT:-8080}"
    # To publish directly to a host port without reverse proxy, uncomment:
    # ports:
    #   - "${PORT:-8080}:${PORT:-8080}"
    environment:
      # Server infrastructure settings (configured here, NOT in config.yml)
      - PORT=${PORT:-8080}
      - SESSION_SECRET=change-this-to-a-secure-random-key-in-production
      - TIMEOUT=15
      # Optional: set ADMIN_USER & ADMIN_PASSWORD to inject/override an admin account at runtime
      # - ADMIN_USER=admin
      # - ADMIN_PASSWORD=adminpassword
    volumes:
      # Mount configuration file read-write so the WebUI Config Editor can persist changes
      - ./config.yml:/app/config.yml:rw
      # Mount SSH keys directory read-only
      - ./keys:/app/keys:ro
